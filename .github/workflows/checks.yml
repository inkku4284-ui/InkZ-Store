name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inkz_test
          POSTGRES_PASSWORD: inkz_test_fixture
          POSTGRES_DB: inkz_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inkz_test -d inkz_ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
        env:
          INKZ_LEDGER_TEST_DATABASE_URL: postgresql://inkz_test:inkz_test_fixture@127.0.0.1:5432/inkz_ledger_test
      - run: node scripts/check-rings.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
